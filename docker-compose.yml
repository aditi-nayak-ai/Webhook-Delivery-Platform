services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webhook_platform
      POSTGRES_USER: webhook_platform
      POSTGRES_PASSWORD: webhook_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build: .
    command: celery -A core worker --loglevel=info
    env_file: .env
    depends_on:
      - db
      - redis

volumes:
  pgdata:
