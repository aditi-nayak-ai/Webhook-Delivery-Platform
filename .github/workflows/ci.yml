name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Tests
        env:
          SECRET_KEY: 'test-secret-key-for-local-dev-only'
          FIELD_ENCRYPTION_KEY: 'test-secret-key-for-local-dev-only'
          DATABASE_URL: 'postgres://postgres:postgrespassword@localhost:5432/test_db'
          REDIS_URL: 'redis://localhost:6379/0'
          DEBUG: 'True'
          ALLOWED_HOSTS: '*'
        run: |
          python manage.py makemigrations
          python manage.py migrate
          python manage.py test
EOF
